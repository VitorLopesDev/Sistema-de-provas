services:
  postgres:
    image: postgres:16
    container_name: sistema-provas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_provas
      POSTGRES_USER: sistema_provas
      POSTGRES_PASSWORD: sistema_provas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
